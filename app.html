<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeriesWeb</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <section id="searchSection">
            <header>
                <h1>Buscador de Series</h1>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Ej: Stranger Things, Dark...">
                    <button id="searchBtn">Buscar</button>
                </div>
            </header>
            <div id="resultsGrid" class="grid"></div>
        </section>

        <section id="detailSection" class="hidden">
            <button id="backBtn" class="btn-back">← Volver al listado</button>
            <div id="detailContent" class="detail-container"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
